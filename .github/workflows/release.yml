name: Release Stable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore bundled Harness runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download runtime-v1 --repo $env:GITHUB_REPOSITORY --pattern stable-runtime-win-x64.zip --output stable-runtime-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the bundled Harness runtime.' }
          Expand-Archive -LiteralPath stable-runtime-win-x64.zip -DestinationPath runtime
          if (-not (Test-Path -LiteralPath runtime/node/node.exe) -or -not (Test-Path -LiteralPath runtime/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js)) { throw 'Runtime archive is incomplete.' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build full installer and lightweight updater
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Full installer build failed.' }
          npm run dist:update
          if ($LASTEXITCODE -ne 0) { throw 'Lightweight updater build failed.' }
      - name: Download previous Stable installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path previous-release -Force | Out-Null
          gh release download v0.9.31 --repo $env:GITHUB_REPOSITORY --pattern Stable-Setup-0.9.31-x64.exe --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the v0.9.31 baseline installer.' }
      - name: Verify visible update success and rollback
        timeout-minutes: 75
        shell: pwsh
        run: |
          ./tests/verify-update-installer.ps1 `
            -PreviousInstaller ./previous-release/Stable-Setup-0.9.31-x64.exe `
            -UpdateInstaller ./release-0.91.2-update/Stable-Update-0.91.2-x64.exe `
            -ExpectedVersion 0.91.2
      - name: Upload installer QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-update-installer-qa
          path: ${{ runner.temp }}/stable-update-installer-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Publish GitHub Release assets
        if: success() && github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $tag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $tag."
          }
          $output = "release-$version"
          $updateOutput = "release-$version-update"
          $assets = @(
            "$output/Stable-Setup-$version-x64.exe",
            "$updateOutput/Stable-Update-$version-x64.exe",
            "$updateOutput/Stable-Update-$version-x64.exe.blockmap",
            "$updateOutput/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Stable $tag" --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag." }
          }
          gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more GitHub Release assets for $tag." }
          $uploaded = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect GitHub Release assets for $tag." }
          foreach ($asset in $assets) {
            if ($uploaded -notcontains (Split-Path -Leaf $asset)) { throw "Release asset was not uploaded: $asset" }
          }
