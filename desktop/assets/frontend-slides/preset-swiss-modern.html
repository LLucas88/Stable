  *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity}body{margin:0;container-type:inline-size;background:#ff3300;color:#ff3300;font:30px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.slide{position:relative;width:1920px;height:1080px;zoom:calc(100cqw / 1920px);overflow:hidden;scroll-snap-align:start;padding:96px 112px;border-bottom:1px solid color-mix(in srgb,currentColor 18%,transparent);background:#ff3300}.stage{height:100%;position:relative;z-index:1}.eyebrow{font-size:23px;letter-spacing:5px;display:flex;justify-content:space-between;border-bottom:2px solid currentColor;padding-bottom:24px}.title{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:142px;line-height:1.16;letter-spacing:-4px;margin:110px 0 42px;max-width:1350px;white-space:pre-line}.subtitle{max-width:960px;font-size:34px;opacity:.8}.foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font-size:24px}.art{position:absolute;width:620px;height:620px;border-radius:50%;right:-100px;top:200px;background:#d65332;opacity:.24;transform:rotate(-18deg)}.art:after{content:"";position:absolute;inset:130px;border:3px solid #ff3300;border-radius:inherit}.kicker{color:#d65332;font-size:28px}h2{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:82px;line-height:1.2;margin:55px 0 60px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.card{padding:42px;border:2px solid color-mix(in srgb,currentColor 25%,transparent);min-height:340px}.card strong{font-size:76px;color:#d65332}h3{font-size:38px;margin:18px 0}p{margin:14px 0}.card p{font-size:28px;opacity:.78}.closing{max-width:1400px;font-size:104px;line-height:1.25;margin:140px 0 60px}.rule{width:180px;height:12px;background:#d65332}.terminal{font-family:Consolas,"Microsoft YaHei",monospace;background-image:linear-gradient(#d653320c 1px,transparent 1px),linear-gradient(90deg,#d653320c 1px,transparent 1px);background-size:40px 40px}.terminal .title{color:#d65332;font-family:Consolas,"Microsoft YaHei",monospace}.terminal .art{border-radius:0;opacity:1;width:340px;height:340px;right:0;top:250px;box-shadow:20px 20px 0 #ff3300;background:transparent;border:8px solid #d65332}.terminal .title{max-width:1200px;font-size:128px}.terminal .card{box-shadow:8px 8px 0 #d65332}.editorial .title,.serif .title,.editorial h2,.serif h2{font-family:Georgia,"SimSun",serif;font-weight:400}.editorial .art{width:340px;height:680px;right:0;top:170px;border-radius:0;opacity:.8;background:repeating-linear-gradient(0deg,#d65332,#d65332 8px,transparent 8px,transparent 22px)}.editorial .title{font-size:158px}.editorial .cards{gap:0}.editorial .card{border-width:0 0 0 2px}.split.cover{background:linear-gradient(90deg,#ff3300 64%,#d65332 64%)}.split .title{max-width:1120px;font-size:132px}.split .art{right:-40px;background:#ff3300;opacity:.85;width:480px;height:480px;border-radius:18px}.split .art:after{border-color:#d65332}.geometry.cover{background:linear-gradient(110deg,#ff3300 64%,#ff3300 64%)}.geometry .title{max-width:1150px}.geometry .art{right:0;opacity:1;width:380px;height:620px;background:#d65332;border-radius:200px}.geometry .card{border-radius:45px;background:color-mix(in srgb,#d65332 12%,#ff3300);border:0}.serif .art{filter:blur(60px);background:radial-gradient(circle,#d65332,#ff3300,transparent);opacity:.8}.serif .title{font-size:156px;position:relative}.poster.cover{background:#d65332;color:#ff3300}.poster .title{font-size:176px;font-weight:900;line-height:1.06;max-width:1500px}.poster .art{width:440px;height:440px;right:-140px;background:#ff3300;opacity:.85;border-radius:0;top:380px;transform:rotate(30deg)}.poster .eyebrow{border-width:6px}.poster .card{border-top:12px solid #d65332}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.slide{zoom:.5;break-after:page}}

变成行动</h1><p class="subtitle">在这里写下你的项目主题、核心主张与一句话介绍。</p><div class="foot"><span>项目提案 · 示例内容</span><span>请替换为真实资料 ↗</span></div></div></section><section class="slide poster"><div class="stage"><div class="eyebrow"><span>思路与结构</span><span>02 / 03</span></div><h2>把核心问题讲清楚</h2><div class="cards"><article class="card"><strong>01</strong><h3>我们看到了什么</h3><p>填写已验证的事实与背景，标注资料来源。</p></article><article class="card"><strong>02</strong><h3>这意味着什么</h3><p>写出关键判断，区分证据、假设与未知信息。</p></article><article class="card"><strong>03</strong><h3>接下来如何行动</h3><p>明确行动、负责人及可以验证的完成标准。</p></article></div><div class="foot"><span>请用实际资料替换示例</span><span>观点 · 证据 · 行动</span></div></div></section><section class="slide poster"><div class="stage"><div class="eyebrow"><span>下一步</span><span>03 / 03</span></div><div class="closing">让下一步，<br>清晰而具体。</div><div class="rule"></div><p class="subtitle">在这里填写行动安排、交付时间与负责人。</p><div class="foot"><span>谢谢阅读</span><span>讨论 / 反馈</span></div></div></section><script>document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown','ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();const slides=[...document.querySelectorAll('.slide')],i=Math.round(scrollY/slides[0].getBoundingClientRect().height),d=/Left|Up/.test(e.key)?-1:1;slides[Math.max(0,Math.min(slides.length-1,i+d))].scrollIntoView();}});</script></body></html>
